server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip the text-heavy assets Vite emits; images/fonts are already compressed formats.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed asset filenames (Vite's default) are safe to cache forever; index.html itself must
    # never be cached, or a deploy wouldn't reach existing visitors until their cache expired.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing (react-router) — any path that isn't a real static file falls back to
    # index.html so a hard refresh on e.g. /app/football doesn't 404 at the web server.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
