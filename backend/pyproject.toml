[project]
name = "titaniq-backend"
version = "0.1.0"
description = "TitanIQ backend — modular monolith (see docs/architecture.md)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "asyncpg>=0.29",
    "redis>=5.0",
    "celery>=5.4",
    "cryptography>=42.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "catboost>=1.2",
    "shap>=0.46",
    "optuna>=4.0",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "fakeredis>=2.23",
    "lupa>=2.2",  # Lua interpreter fakeredis needs to support EVAL/EVALSHA (required by Kombu's Redis transport lock)
    "pytest-cov>=5.0",
    "websockets>=12.0",  # live Supabase integration tier only — Realtime channel-join smoke test
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "modules*"]
