name: CI

# Gates deploys per the production deployment spec's own instruction ("tests must pass... do not
# deploy known failing builds"). Render's own GitHub integration triggers a deploy on push
# regardless of CI status — Render has no native "wait for checks" gate — so branch protection
# requiring this workflow to pass before merge to the deploy branch is the real enforcement point,
# not this file alone.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: pip install ".[dev]"
      - name: Run backend unit tests
        working-directory: backend
        run: python -m pytest tests/unit -q

  frontend-build:
    runs-on: ubuntu-latest
    # frontend/src/lib/env.ts requires these at module-eval time (VITE_SUPABASE_URL/ANON_KEY
    # unconditionally, VITE_API_BASE_URL outside dev mode) — the build step happened to pass
    # without them, but every vitest file that imports anything touching env.ts failed with
    # "Missing required env var" once real prediction-intelligence/match-detail specs started
    # importing modules that reach it transitively. Same public, non-secret values already
    # committed in frontend/.env.example and used by android-apk.yml — not secrets, safe here.
    env:
      VITE_API_BASE_URL: https://titan-intelligence-lab.onrender.com
      VITE_SUPABASE_URL: https://irhnoilyaqgewfidhunx.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_rThsO5r97_EqobhVt73jbg_ia0UGAnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Typecheck + production build
        working-directory: frontend
        run: npm run build
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test
