name: CI

# Gates deploys per the production deployment spec's own instruction ("tests must pass... do not
# deploy known failing builds"). Render's own GitHub integration triggers a deploy on push
# regardless of CI status — Render has no native "wait for checks" gate — so branch protection
# requiring this workflow to pass before merge to the deploy branch is the real enforcement point,
# not this file alone.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: pip install ".[dev]"
      - name: Run backend unit tests
        working-directory: backend
        run: python -m pytest tests/unit -q

  frontend-build:
    runs-on: ubuntu-latest
    # frontend/src/lib/env.ts's required() only actually runs when the bundled JS executes, not
    # during `vite build`'s bundling/typecheck — so the build step never needed these — but
    # `npm run test` (vitest) does execute every imported module, and VITE_SUPABASE_URL/ANON_KEY
    # are required unconditionally there. Deliberately NOT setting VITE_API_BASE_URL: vitest runs
    # with import.meta.env.DEV true, where env.ts falls back to 'http://localhost:8000' unless
    # this is set — client.test.ts asserts exactly that default, so setting it here would break
    # that test instead of fixing anything (a real regression caught by re-running this fix).
    # Same public, non-secret Supabase values already committed in frontend/.env.example and used
    # by android-apk.yml — not secrets, safe here.
    env:
      VITE_SUPABASE_URL: https://irhnoilyaqgewfidhunx.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_rThsO5r97_EqobhVt73jbg_ia0UGAnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Typecheck + production build
        working-directory: frontend
        run: npm run build
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test
