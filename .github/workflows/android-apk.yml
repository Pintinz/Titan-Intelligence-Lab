name: Android APK (debug)

# Builds a debug APK of the Capacitor-wrapped frontend — auto-signed with Android's own debug
# keystore (installable on your own device for testing, NOT for Play Store, which requires a real
# release signing key this workflow doesn't have). No secrets required: the VITE_* build args
# below are the same public, non-secret identifiers already committed in frontend/.env.example
# (Supabase anon key, AdMob app/ad-unit IDs) plus the real production API URL.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "frontend/android/**"
      - "frontend/src/**"
      - "frontend/capacitor.config.ts"
      - "frontend/package.json"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://titan-intelligence-lab.onrender.com
      VITE_SUPABASE_URL: https://irhnoilyaqgewfidhunx.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_rThsO5r97_EqobhVt73jbg_ia0UGAnd
      VITE_ADMOB_ANDROID_APP_ID: ca-app-pub-5093738800594754~9488584536
      VITE_ADMOB_ANDROID_REWARDED_AD_UNIT_ID: ca-app-pub-5093738800594754/3918256753
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build web bundle
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Assemble debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: titaniq-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
